<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTERWORK - Restaurant POS V.5.5</title>
    
    <!-- Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js สำหรับทำกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * { font-family: 'Kanit', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); }
        .dark-glass { background: rgba(26, 26, 26, 0.85); backdrop-filter: blur(16px); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* เพิ่ม Animation สำหรับ Popup Modal */
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 overflow-hidden">

    <div id="app" class="h-screen w-full flex flex-col relative">
        <!-- Content will be injected here by JavaScript -->
        <div class="flex h-full items-center justify-center">
            <div class="text-2xl font-bold text-orange-500 animate-pulse"><i class="fas fa-spinner fa-spin mr-3"></i>กำลังโหลดระบบ AFTERWORK V.5.5...</div>
        </div>
    </div>

    <!-- Firebase SDK (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // 🚨 นำ FIREBASE CONFIG ของคุณมาใส่ตรงนี้ 🚨
        // ==========================================
        const myFirebaseConfig = {
            apiKey: "AIzaSyCcF_GpHAEwvn0TMXns2w5eym2EqfJ_No8",
            authDomain: "afterwork-pos.firebaseapp.com",
            projectId: "afterwork-pos",
            storageBucket: "afterwork-pos.firebasestorage.app",
            messagingSenderId: "423772441953",
            appId: "1:423772441953:web:e46e065da264b9323bc920",
            measurementId: "G-H89M5VH6RG"
        };

        let finalConfig = myFirebaseConfig;
        if (Object.keys(finalConfig).length === 0 && typeof __firebase_config !== 'undefined') {
            finalConfig = JSON.parse(__firebase_config);
        }
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'afterwork-pos';
        const app = initializeApp(finalConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ==========================================
        // DATA & STATE MANAGEMENT
        // ==========================================
        const DEFAULT_MENU_ITEMS = [
            { name: 'กุ้งแช่น้ำปลา (ชุดเล็ก)', price: 59, cost: 25, category: 'เมนูกุ้งแช่น้ำปลา', image: 'https://shorturl.asia/yPsIl' },
            { name: 'กุ้งแช่น้ำปลา (ชุดใหญ่)', price: 100, cost: 45, category: 'เมนูกุ้งแช่น้ำปลา', image: 'https://shorturl.asia/OJt8q' },
            { name: 'หมูมะนาว (ชุดเล็ก)', price: 59, cost: 25, category: 'เมนูหมูมะนาว', image: 'https://shorturl.asia/Oo0gS' },
            { name: 'หมูมะนาว (ชุดใหญ่)', price: 100, cost: 45, category: 'เมนูหมูมะนาว', image: 'https://shorturl.asia/3l0fe' },
            { name: 'ชุดรวมหมู+กุ้ง (ชุดใหญ่)', price: 100, cost: 50, category: 'เมนูชุดรวม', image: 'https://shorturl.asia/5pHgX' },    
            { name: 'สุกี้แห้งหมู', price: 40, cost: 18, category: 'เมนูสุกี้คั่วกระทะ', image: 'https://shorturl.asia/r5nTs' },
            { name: 'สุกี้แห้งกุ้ง', price: 50, cost: 22, category: 'เมนูสุกี้คั่วกระทะ', image: 'https://shorturl.asia/45wT1' },
            { name: 'สุกี้แห้งรวม', price: 60, cost: 28, category: 'เมนูสุกี้คั่วกระทะ', image: 'https://shorturl.asia/NiI12' },
        ];

        window.appState = {
            user: null,
            view: '', // สถานะปัจจุบันของหน้าจอ
            lastRenderedView: '', // ไว้เช็คว่าหน้าจอวาด Skeleton หรือยัง
            orders: [],
            expenses: [],
            menus: [], 
            cart: [],
            customerName: '',
            isOrdering: false,
            adminTab: 'dashboard', 
            adminFilter: 'today',
            kitchenTimerInterval: null,
            profitChartInstance: null, // เก็บตัวแปรสำหรับวาด Chart
            isCartOpen: false, 
            orderToCancel: null, 
            isNameModalOpen: false,
            hasSeededMenus: false,
            isMenuModalOpen: false,
            editingMenu: null 
        };

        // ==========================================
        // INITIALIZATION & AUTH
        // ==========================================
        async function init() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth init failed", e);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.appState.user = user;
                    startListeners();
                    window.ctrl.setView('home'); 
                }
            });
        }

        // ==========================================
        // DATABASE LISTENERS
        // ==========================================
        function startListeners() {
            const menusRef = collection(db, 'artifacts', appId, 'public', 'data', 'menus');
            onSnapshot(menusRef, (snapshot) => {
                if (snapshot.empty && !window.appState.hasSeededMenus) {
                    window.appState.hasSeededMenus = true;
                    DEFAULT_MENU_ITEMS.forEach(async (item) => {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'menus'), {
                            ...item, createdAt: serverTimestamp()
                        });
                    });
                } else {
                    window.appState.menus = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    window.appState.menus.sort((a, b) => a.category.localeCompare(b.category, 'th'));
                    updateDynamicUI(); 
                }
            }, (error) => console.error(error));

            const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
            onSnapshot(ordersRef, (snapshot) => {
                window.appState.orders = snapshot.docs.map(doc => {
                    const data = doc.data();
                    data.timeMs = data.createdAt?.seconds ? data.createdAt.seconds * 1000 : Date.now();
                    return { id: doc.id, ...data };
                });
                if(window.appState.view === 'kitchen' || window.appState.view === 'admin') updateDynamicUI(); 
            }, (error) => console.error(error));

            const expensesRef = collection(db, 'artifacts', appId, 'public', 'data', 'expenses');
            onSnapshot(expensesRef, (snapshot) => {
                window.appState.expenses = snapshot.docs.map(doc => {
                    const data = doc.data();
                    data.timeMs = data.createdAt?.seconds ? data.createdAt.seconds * 1000 : Date.now();
                    return { id: doc.id, ...data };
                });
                if(window.appState.view === 'admin') updateDynamicUI(); 
            }, (error) => console.error(error));
        }

        // ==========================================
        // CONTROLLERS
        // ==========================================
        window.ctrl = {
            setView: (view) => {
                window.appState.view = view;
                if(view === 'customer') { 
                    window.appState.cart = []; 
                    window.appState.customerName = ''; 
                    window.appState.isCartOpen = false;
                    window.appState.isNameModalOpen = false; 
                }
                if(view === 'admin') {
                    window.appState.adminTab = 'dashboard';
                }
                renderSkeleton(); 
                updateDynamicUI(); 
            },
            
            toggleCart: (forceState = null) => {
                const modal = document.getElementById('mobileCartModal');
                if(!modal) return;
                const isHidden = modal.classList.contains('hidden');
                const willShow = forceState !== null ? forceState : isHidden;
                
                if (willShow) {
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                } else {
                    modal.classList.remove('flex');
                    modal.classList.add('hidden');
                }
            },

            toggleNameModal: (forceState = null) => {
                const modal = document.getElementById('customerNameModal');
                if(!modal) return;
                const isHidden = modal.classList.contains('hidden');
                const willShow = forceState !== null ? forceState : isHidden;
                
                if (willShow) {
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                    setTimeout(() => document.getElementById('modalCustomerNameInput')?.focus(), 100);
                } else {
                    modal.classList.remove('flex');
                    modal.classList.add('hidden');
                }
            },
            
            updateCart: (itemId, delta) => {
                const item = window.appState.menus.find(i => i.id === itemId);
                let cart = window.appState.cart;
                const existingIndex = cart.findIndex(i => i.id === itemId);
                
                if (existingIndex >= 0) {
                    cart[existingIndex].quantity += delta;
                    if (cart[existingIndex].quantity <= 0) cart.splice(existingIndex, 1);
                } else if (delta > 0) {
                    cart.push({ ...item, quantity: 1 });
                }
                if (cart.length === 0) window.ctrl.toggleCart(false); 
                updateDynamicUI();
            },

            removeItem: (itemId) => {
                window.appState.cart = window.appState.cart.filter(item => item.id !== itemId);
                if (window.appState.cart.length === 0) window.ctrl.toggleCart(false);
                updateDynamicUI();
            },
            
            setCustomerName: (name) => { 
                window.appState.customerName = name; 
                const mainInput = document.getElementById('mainCustomerNameInput');
                const modalInput = document.getElementById('modalCustomerNameInput');
                if(mainInput && mainInput.value !== name) mainInput.value = name;
                if(modalInput && modalInput.value !== name) modalInput.value = name;
            },
            
            submitOrder: async () => {
                const { cart, customerName, user } = window.appState;
                if (cart.length === 0 || !user || window.appState.isOrdering) return;
                
                if (!customerName || customerName.trim() === '') {
                    window.ctrl.toggleCart(false); 
                    window.ctrl.toggleNameModal(true); 
                    return;
                }

                window.appState.isOrdering = true;
                window.ctrl.toggleCart(false); 
                window.ctrl.toggleNameModal(false); 
                updateDynamicUI();

                const totalAmount = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
                const totalCost = cart.reduce((sum, i) => sum + ((i.cost || 0) * i.quantity), 0);
                
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'orders'), {
                        customerName: customerName, items: cart, total: totalAmount, totalCost: totalCost, 
                        status: 'active', createdAt: serverTimestamp(), createdBy: user.uid 
                    });
                    
                    document.getElementById('app').innerHTML = `
                        <div class="flex flex-col h-screen items-center justify-center bg-orange-50 p-6 text-center fade-in">
                            <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center shadow-2xl mb-8">
                                <i class="fas fa-check-circle text-orange-500 text-6xl"></i>
                            </div>
                            <h1 class="text-5xl font-black text-gray-900 mb-4 tracking-tight">สั่งอาหารสำเร็จ!</h1>
                            <p class="text-2xl text-gray-600 font-medium">ระบบส่งออเดอร์เข้าห้องครัวแล้ว</p>
                        </div>`;
                    
                    setTimeout(() => {
                        window.appState.isOrdering = false;
                        window.ctrl.setView('home');
                    }, 3000);

                } catch (error) {
                    console.error("Submit Error:", error);
                    alert("เกิดข้อผิดพลาด ลองใหม่อีกครั้ง");
                    window.appState.isOrdering = false;
                    updateDynamicUI();
                }
            },

            completeOrder: async (orderId) => {
                if (!window.appState.user) return;
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId), {
                    status: 'completed', completedAt: serverTimestamp()
                });
            },
            
            openCancelModal: (orderId) => {
                document.getElementById('kitchenCancelOrderId').value = orderId;
                const modal = document.getElementById('kitchenCancelModal');
                if(modal) { modal.classList.remove('hidden'); modal.classList.add('flex'); }
            },

            closeCancelModal: () => {
                const modal = document.getElementById('kitchenCancelModal');
                if(modal) { modal.classList.remove('flex'); modal.classList.add('hidden'); }
            },

            cancelOrder: async () => {
                const orderId = document.getElementById('kitchenCancelOrderId').value;
                if (!orderId || !window.appState.user) return;
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId), {
                        status: 'cancelled', cancelledAt: serverTimestamp()
                    });
                } catch (error) {
                    console.error("Cancel Error:", error);
                } finally {
                    window.ctrl.closeCancelModal();
                }
            },

            setAdminTab: (tab) => {
                window.appState.adminTab = tab;
                document.getElementById('admin-tab-dashboard').style.display = tab === 'dashboard' ? 'block' : 'none';
                document.getElementById('admin-tab-menus').style.display = tab === 'menus' ? 'block' : 'none';
                updateDynamicUI(); 
            },
            
            setAdminFilter: (filter) => {
                window.appState.adminFilter = filter;
                updateDynamicUI();
            },
            
            addExpense: async (event) => {
                event.preventDefault();
                if (!window.appState.user) return;
                const title = document.getElementById('expTitle').value;
                const amount = parseFloat(document.getElementById('expAmount').value);
                const status = document.getElementById('expStatus').value;
                
                if(!title || !amount) return;

                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'expenses'), {
                    title: title, amount: amount, status: status, 
                    createdAt: serverTimestamp(), createdBy: window.appState.user.uid
                });
                document.getElementById('expTitle').value = '';
                document.getElementById('expAmount').value = '';
                document.getElementById('expStatus').value = 'paid';
            },
            
            markExpensePaid: async (expenseId) => {
                if (!window.appState.user) return;
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', expenseId), {
                    status: 'paid', paidAt: serverTimestamp()
                });
            },
            
            openMenuModal: (menuId = null) => {
                const modal = document.getElementById('adminMenuModal');
                const form = document.getElementById('adminMenuForm');
                if(!modal || !form) return;

                form.reset(); 
                document.getElementById('modalMenuId').value = menuId || '';

                if (menuId) {
                    const menu = window.appState.menus.find(m => m.id === menuId);
                    if(menu) {
                        document.getElementById('menuName').value = menu.name;
                        document.getElementById('menuCategory').value = menu.category;
                        document.getElementById('menuPrice').value = menu.price;
                        document.getElementById('menuCost').value = menu.cost;
                        document.getElementById('menuImage').value = menu.image;
                        document.getElementById('menuModalTitle').innerHTML = '<i class="fas fa-edit text-orange-500 mr-2"></i> แก้ไขเมนู';
                        document.getElementById('menuModalBtnSubmit').innerText = 'บันทึกการแก้ไข';
                    }
                } else {
                    document.getElementById('menuModalTitle').innerHTML = '<i class="fas fa-plus-circle text-orange-500 mr-2"></i> เพิ่มเมนูใหม่';
                    document.getElementById('menuModalBtnSubmit').innerText = 'เพิ่มเมนู';
                }

                modal.classList.remove('hidden');
                modal.classList.add('flex');
            },

            closeMenuModal: () => {
                const modal = document.getElementById('adminMenuModal');
                if(modal) { modal.classList.remove('flex'); modal.classList.add('hidden'); }
            },

            saveMenu: async (event) => {
                event.preventDefault();
                if (!window.appState.user) return;

                const menuId = document.getElementById('modalMenuId').value;
                const name = document.getElementById('menuName').value;
                const category = document.getElementById('menuCategory').value || 'ทั่วไป';
                const price = parseFloat(document.getElementById('menuPrice').value);
                const cost = parseFloat(document.getElementById('menuCost').value);
                const image = document.getElementById('menuImage').value || 'https://via.placeholder.com/600x400?text=No+Image';

                if (!name || isNaN(price) || isNaN(cost)) return;

                const menuData = { name, category, price, cost, image };

                try {
                    if (menuId) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'menus', menuId), {
                            ...menuData, updatedAt: serverTimestamp()
                        });
                    } else {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'menus'), {
                            ...menuData, createdAt: serverTimestamp()
                        });
                    }
                    window.ctrl.closeMenuModal();
                } catch (error) {
                    console.error("Save Menu Error:", error);
                    alert("เกิดข้อผิดพลาดในการบันทึกเมนู");
                }
            },

            deleteMenu: async (menuId) => {
                if (!confirm("คุณแน่ใจหรือไม่ว่าต้องการลบเมนูนี้?")) return;
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'menus', menuId));
            }
        };

        // ==========================================
        // CHART RENDERING LOGIC
        // ==========================================
        function drawProfitChart(filter, orders, expenses, todayIncome, todayExpenses, todayNetProfit) {
            const ctx = document.getElementById('profitChartCanvas');
            if (!ctx) return;

            // ทำลาย Chart เก่าถ้ามีเพื่อวาดใหม่
            if (window.appState.profitChartInstance) {
                window.appState.profitChartInstance.destroy();
            }

            const now = new Date();
            let labels = [];
            let data = [];
            let chartType = 'line'; // Default เป็น Line Chart (แนวโน้ม)

            // ถ้าเป็นเมื่อวาน หรือวันนี้ จะแสดง Bar Chart เปรียบเทียบ ยอดขาย vs รายจ่าย vs กำไร
            if (filter === 'today' || filter === 'yesterday') {
                chartType = 'bar';
                labels = ['ยอดขายรวม', 'รายจ่ายรวม', 'กำไรสุทธิ'];
                data = [todayIncome, todayExpenses, todayNetProfit];
            } 
            else if (filter === 'week') {
                labels = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสฯ', 'ศุกร์', 'เสาร์', 'อาทิตย์'];
                const dayDiff = now.getDay() === 0 ? 6 : now.getDay() - 1; // ทำให้วันจันทร์ = 0
                const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayDiff).getTime();
                
                for(let i=0; i<7; i++) {
                    const dayStart = startOfWeek + (i * 86400000);
                    const dayEnd = dayStart + 86400000;
                    let dailyInc = 0, dailyExp = 0;
                    
                    orders.forEach(o => { if(o.status !== 'cancelled' && o.timeMs >= dayStart && o.timeMs < dayEnd) dailyInc += o.total; });
                    expenses.forEach(e => { if(e.timeMs >= dayStart && e.timeMs < dayEnd) dailyExp += e.amount; });
                    
                    data.push(dailyInc - dailyExp); // บันทึกกำไรสุทธิแต่ละวัน
                }
            } 
            else if (filter === 'month') {
                const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                labels = Array.from({length: daysInMonth}, (_, i) => String(i + 1));
                const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

                for(let i=0; i<daysInMonth; i++) {
                    const dayStart = startOfMonth + (i * 86400000);
                    const dayEnd = dayStart + 86400000;
                    let dailyInc = 0, dailyExp = 0;
                    
                    orders.forEach(o => { if(o.status !== 'cancelled' && o.timeMs >= dayStart && o.timeMs < dayEnd) dailyInc += o.total; });
                    expenses.forEach(e => { if(e.timeMs >= dayStart && e.timeMs < dayEnd) dailyExp += e.amount; });
                    
                    data.push(dailyInc - dailyExp);
                }
            } 
            else if (filter === 'year') {
                labels = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
                for(let i=0; i<12; i++) {
                    const monthStart = new Date(now.getFullYear(), i, 1).getTime();
                    const monthEnd = new Date(now.getFullYear(), i + 1, 1).getTime();
                    let monthlyInc = 0, monthlyExp = 0;
                    
                    orders.forEach(o => { if(o.status !== 'cancelled' && o.timeMs >= monthStart && o.timeMs < monthEnd) monthlyInc += o.total; });
                    expenses.forEach(e => { if(e.timeMs >= monthStart && e.timeMs < monthEnd) monthlyExp += e.amount; });
                    
                    data.push(monthlyInc - monthlyExp);
                }
            }

            // สร้างกราฟสวยๆ (Gradient หรือ สีตามเสา)
            let bgColor = [];
            let borderColor = '#f97316'; // orange-500

            if (chartType === 'bar') {
                borderColor = 'transparent';
                // ฟ้าสำหรับยอดขาย, แดงสำหรับรายจ่าย, เขียว(หรือแดงถ้าติดลบ) สำหรับกำไร
                bgColor = ['#3b82f6', '#ef4444', todayNetProfit >= 0 ? '#10b981' : '#ef4444'];
            } else {
                const gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 350);
                gradient.addColorStop(0, 'rgba(249, 115, 22, 0.5)'); 
                gradient.addColorStop(1, 'rgba(249, 115, 22, 0.0)');
                bgColor = gradient;
            }

            window.appState.profitChartInstance = new Chart(ctx, {
                type: chartType,
                data: {
                    labels: labels,
                    datasets: [{
                        label: chartType === 'bar' ? 'จำนวนเงิน (บาท)' : 'กำไรสุทธิรายวัน (บาท)',
                        data: data,
                        borderColor: borderColor,
                        backgroundColor: bgColor,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4, // ทำให้กราฟเส้นมีความโค้งมนสวยงาม
                        borderRadius: chartType === 'bar' ? 8 : 0, // ทำขอบเสา Bar ให้มน
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';

                const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);

                // 1. เมนูอาหาร
                const scrollContainer = document.getElementById('menu-scroll-container');
                let scrollPos = 0; if(scrollContainer) scrollPos = scrollContainer.scrollTop; 

                const categories = [...new Set(menus.map(i => i.category))];
                let menuHTML = menus.length === 0 ? `<div class="text-center text-gray-400 py-12"><i class="fas fa-store-slash text-5xl mb-4"></i><p>ยังไม่มีเมนูในระบบ กรุณาเพิ่มเมนูที่หน้า Admin</p></div>` : '';
                
                categories.forEach(cat => {

                    menus.filter(i => i.category === cat).forEach(item => {
                        const qty = cart.find(c => c.id === item.id)?.quantity || 0;
                        menuHTML += `
                        <div onclick="window.ctrl.updateCart('${item.id}', 1)" class="cursor-pointer bg-white rounded-[2rem] overflow-hidden shadow-sm border-2 ${qty > 0 ? 'border-orange-500 ring-4 ring-orange-500/10' : 'border-transparent hover:border-gray-200'} flex flex-col transition-all duration-300 hover:-translate-y-1">

                                <h3 class="text-xl font-bold text-gray-900 mb-2 pointer-events-none">${item.name}</h3>
                                <p class="text-sm text-gray-500 mb-4 line-clamp-2 pointer-events-none">${item.price} บาท</p>
                                <div class="mt-auto flex items-center justify-between pt-2">
                                    <span class="text-2xl font-black text-orange-600 pointer-events-none">${item.price} ฿</span>
                                    ${qty > 0 ? `
                                    <div class="flex items-center space-x-1 bg-gray-50 rounded-full p-1 border border-gray-100" onclick="event.stopPropagation()">
                                        <button onclick="window.ctrl.updateCart('${item.id}', -1)" class="w-10 h-10 rounded-full bg-white shadow-sm text-gray-600 flex items-center justify-center text-xl hover:bg-gray-100"><i class="fas fa-minus text-sm"></i></button>
                                        <span class="text-xl font-bold w-8 text-center text-gray-800">${qty}</span>
                                        <button onclick="window.ctrl.updateCart('${item.id}', 1)" class="w-10 h-10 rounded-full bg-orange-500 shadow-sm text-white flex items-center justify-center text-xl hover:bg-orange-600"><i class="fas fa-plus text-sm"></i></button>
                                    </div>` : `<button class="px-6 py-2.5 rounded-full bg-orange-50 text-orange-600 font-bold hover:bg-orange-100 transition-all pointer-events-none">เพิ่ม</button>`}
                                </div>
                            </div>
                        </div>`;
                    });
                    menuHTML += `</div></div>`;
                });
                const elMenuList = document.getElementById('dynamic-menu-list');
                if(elMenuList) elMenuList.innerHTML = menuHTML;
                if(scrollContainer) scrollContainer.scrollTop = scrollPos; 

                // 2. ตะกร้าสินค้า
                const getCartItemsHTML = () => cart.length === 0 ? `<div class="text-center text-gray-400 py-12 flex flex-col items-center"><i class="fas fa-shopping-basket text-5xl mb-4 text-gray-200"></i><p>ยังไม่ได้เลือกเมนูความอร่อย</p></div>` : cart.map(item => `
                    <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl border border-gray-100 mb-3">
                        <div class="flex items-start flex-1 pr-2"><span class="font-bold text-orange-500 mr-3 text-lg bg-orange-100 w-8 h-8 flex items-center justify-center rounded-lg shrink-0">${item.quantity}</span><div class="flex flex-col"><span class="font-bold text-gray-800 text-lg leading-tight mb-1">${item.name}</span><span class="text-sm text-gray-500">${item.price} ฿ / ที่</span></div></div>
                        <div class="flex items-center space-x-3 shrink-0"><span class="font-black text-gray-900 text-lg">${item.price * item.quantity} ฿</span><button onclick="window.ctrl.removeItem('${item.id}')" class="w-9 h-9 flex items-center justify-center bg-red-50 text-red-500 hover:bg-red-100 rounded-full transition-colors active:scale-95"><i class="fas fa-trash-alt text-sm"></i></button></div>
                    </div>`).join('');
                
                const getCartSummaryHTML = () => `
                    <div class="bg-gray-50 p-5 rounded-3xl border border-gray-100 mb-6 shrink-0">
                        <div class="flex justify-between items-center text-3xl font-black text-gray-900"><span>ยอดรวม</span><span class="text-orange-600">${totalAmount} <span class="text-xl text-gray-500 font-bold">฿</span></span></div>
                    </div>
                    <button onclick="window.ctrl.submitOrder()" ${cart.length === 0 || isOrdering ? 'disabled' : ''} class="w-full shrink-0 py-5 rounded-[1.5rem] text-2xl font-bold text-white transition-all shadow-xl flex justify-center items-center ${cart.length === 0 ? 'bg-gray-300' : 'bg-gradient-to-r from-orange-500 to-orange-600 active:scale-95'}">${isOrdering ? '<i class="fas fa-spinner fa-spin mr-3"></i> กำลังส่ง...' : 'ยืนยันออเดอร์'}</button>
                `;

                const elDesktopCartContent = document.getElementById('dynamic-desktop-cart-content');
                const elDesktopCartSummary = document.getElementById('dynamic-desktop-cart-summary');
                if(elDesktopCartContent) elDesktopCartContent.innerHTML = getCartItemsHTML();
                if(elDesktopCartSummary) elDesktopCartSummary.innerHTML = getCartSummaryHTML();

                const elMobileCartContent = document.getElementById('dynamic-mobile-cart-content');
                const elMobileCartSummary = document.getElementById('dynamic-mobile-cart-summary');
                if(elMobileCartContent) elMobileCartContent.innerHTML = getCartItemsHTML();
                if(elMobileCartSummary) elMobileCartSummary.innerHTML = getCartSummaryHTML();

                // 3. Badges ตะกร้า
                const badgeMobile = document.getElementById('mobile-cart-badge');
                const badgeTitleMobile = document.getElementById('mobile-cart-title-badge');
                const badgeTitleDesktop = document.getElementById('desktop-cart-title-badge');
                if(badgeMobile) { badgeMobile.innerHTML = totalItems; badgeMobile.style.display = totalItems > 0 ? 'flex' : 'none'; }
                if(badgeTitleMobile) { badgeTitleMobile.innerHTML = totalItems; badgeTitleMobile.style.display = totalItems > 0 ? 'inline-block' : 'none'; }
                if(badgeTitleDesktop) { badgeTitleDesktop.innerHTML = totalItems; badgeTitleDesktop.style.display = totalItems > 0 ? 'inline-block' : 'none'; }
            }
            
            // --- อัปเดต KITCHEN VIEW ---
            else if (view === 'kitchen') {
                const activeOrders = orders.filter(o => o.status === 'active').sort((a, b) => a.timeMs - b.timeMs);
                
                const elQueueBadge = document.getElementById('kitchen-queue-badge');
                if(elQueueBadge) elQueueBadge.innerHTML = `รอทำ ${activeOrders.length} คิว`;

                let gridHTML = activeOrders.length === 0 ? `<div class="h-full flex flex-col items-center justify-center text-gray-600 col-span-full mt-20"><i class="fas fa-check-circle text-6xl text-gray-700 mb-6"></i><h2 class="text-4xl font-bold text-gray-400 mb-2">ครัวว่างแล้ว</h2><p class="text-xl">เยี่ยมมากเชฟ! ไม่มีออเดอร์ค้าง</p></div>` : activeOrders.map((order, index) => `
                    <div class="bg-[#1a1a1a] rounded-3xl shadow-xl overflow-hidden border border-[#2a2a2a] flex flex-col max-h-[75vh]">
                        <div class="bg-[#222] p-5 border-b border-[#333] flex justify-between items-start relative shrink-0">
                            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-500 to-yellow-500"></div>
                            <div><span class="bg-orange-500 text-white text-sm font-bold px-3 py-1 rounded-lg mb-3 inline-block shadow-lg">คิวที่ ${index + 1}</span><h3 class="text-2xl font-bold text-white"><i class="fas fa-user mr-2 text-gray-400 text-lg"></i>${order.customerName}</h3></div>
                            <div class="bg-[#121212] px-3 py-2 rounded-xl border border-[#333] kitchen-timer text-orange-400 font-mono font-bold shrink-0 ml-2" data-time="${order.timeMs}">--:--</div>
                        </div>
                        <div class="p-5 flex-1 space-y-4 overflow-y-auto hide-scrollbar">
                            ${order.items.map(item => `<div class="flex items-center text-xl bg-[#222] p-3 rounded-2xl border border-[#2a2a2a]"><span class="bg-orange-500/20 text-orange-400 font-bold w-12 h-12 flex items-center justify-center rounded-xl mr-4 border border-orange-500/30 text-2xl shrink-0">${item.quantity}</span><span class="text-gray-200 font-medium">${item.name}</span></div>`).join('')}
                        </div>
                        <div class="flex space-x-3 p-5 bg-[#1a1a1a] border-t border-[#2a2a2a] shrink-0">
                            <button onclick="window.ctrl.openCancelModal('${order.id}')" class="w-16 h-16 shrink-0 bg-[#333] hover:bg-red-600/80 text-gray-400 hover:text-white rounded-[1.2rem] shadow-sm transition-all active:scale-95 flex items-center justify-center" title="ยกเลิกออเดอร์นี้"><i class="fas fa-trash-alt text-xl"></i></button>
                            <button onclick="window.ctrl.completeOrder('${order.id}')" class="flex-1 bg-green-600 text-white text-xl font-bold py-4 rounded-[1.2rem] shadow-lg transition-transform active:scale-95 flex items-center justify-center"><i class="fas fa-check-circle mr-2"></i> ทำเสร็จแล้ว (Serve)</button>
                        </div>
                    </div>`).join('');
                
                const elOrders = document.getElementById('dynamic-kitchen-orders');
                if(elOrders) elOrders.innerHTML = gridHTML;
            }

            // --- อัปเดต ADMIN VIEW ---
            else if (view === 'admin') {
                const elAdminTabs = document.getElementById('dynamic-admin-tabs-buttons');
                if(elAdminTabs) {
                    elAdminTabs.innerHTML = `
                        <button onclick="window.ctrl.setAdminTab('dashboard')" class="flex-1 md:flex-none px-6 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center justify-center ${adminTab === 'dashboard' ? 'bg-white shadow-sm text-orange-600' : 'text-gray-500 hover:text-gray-700'}"><i class="fas fa-chart-line mr-2"></i> สรุปบัญชี</button>
                        <button onclick="window.ctrl.setAdminTab('menus')" class="flex-1 md:flex-none px-6 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center justify-center ${adminTab === 'menus' ? 'bg-white shadow-sm text-orange-600' : 'text-gray-500 hover:text-gray-700'}"><i class="fas fa-utensils mr-2"></i> จัดการเมนู</button>
                    `;
                }

                if (adminTab === 'dashboard') {
                    const selectEl = document.getElementById('adminFilterSelect');
                    if(selectEl && selectEl.value !== adminFilter) selectEl.value = adminFilter;

                    // การคำนวณ Filter รวมของเมื่อวาน
                    const now = new Date();
                    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                    const startOfYesterday = startOfToday - (24 * 60 * 60 * 1000); // ย้อนหลัง 1 วัน (24 ชั่วโมง)
                    const startOfWeek = startOfToday - (now.getDay() * 24 * 60 * 60 * 1000);
                    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
                    const startOfYear = new Date(now.getFullYear(), 0, 1).getTime();
                    
                    const isWithinFilter = (timeMs) => {
                        if (adminFilter === 'today') return timeMs >= startOfToday;
                        if (adminFilter === 'yesterday') return timeMs >= startOfYesterday && timeMs < startOfToday;
                        if (adminFilter === 'week') return timeMs >= startOfWeek;
                        if (adminFilter === 'month') return timeMs >= startOfMonth;
                        if (adminFilter === 'year') return timeMs >= startOfYear;
                        return true;
                    };

                    let totalIncome = 0, totalFoodCost = 0, totalExpenses = 0, pendingAmount = 0;
                    let itemSales = {};
                    const filteredExp = [];

                    orders.forEach(o => {
                        if(isWithinFilter(o.timeMs) && o.status !== 'cancelled') {
                            totalIncome += o.total; totalFoodCost += o.totalCost || 0; 
                            o.items.forEach(item => {
                                if(!itemSales[item.name]) itemSales[item.name] = { count: 0, revenue: 0 };
                                itemSales[item.name].count += item.quantity; itemSales[item.name].revenue += (item.price * item.quantity);
                            });
                        }
                    });

                    expenses.forEach(e => {
                        if(isWithinFilter(e.timeMs)) {
                            totalExpenses += e.amount;
                            if(e.status === 'pending') pendingAmount += e.amount;
                            filteredExp.push(e);
                        }
                    });

                    const grossProfit = totalIncome - totalFoodCost; 
                    // 🚨 แก้ไขการหักลบรายจ่าย ไม่ให้ซ้ำซ้อน
                    const netProfit = totalIncome - totalExpenses; 
                    
                    const bestSellersArr = Object.keys(itemSales).map(name => ({ name, ...itemSales[name] })).sort((a,b) => b.count - a.count).slice(0, 5);

                    const elStats = document.getElementById('dynamic-dashboard-stats');
                    if(elStats) elStats.innerHTML = `
                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 relative overflow-hidden"><div class="absolute -right-4 -top-4 w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center opacity-50"><i class="fas fa-wallet text-blue-500 text-2xl"></i></div><p class="text-gray-500 font-bold mb-1 text-sm md:text-base">ยอดขายรวม (Sales)</p><h2 class="text-2xl md:text-4xl font-black text-blue-600">${totalIncome.toLocaleString()} <span class="text-lg text-gray-400">฿</span></h2></div>
                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 relative overflow-hidden"><div class="absolute -right-4 -top-4 w-16 h-16 bg-orange-50 rounded-full flex items-center justify-center opacity-50"><i class="fas fa-fish text-orange-500 text-2xl"></i></div><p class="text-gray-500 font-bold mb-1 text-sm md:text-base">ต้นทุนอาหาร (COGS)</p><h2 class="text-2xl md:text-4xl font-black text-orange-500">${totalFoodCost.toLocaleString()} <span class="text-lg text-gray-400">฿</span></h2></div>
                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 relative overflow-hidden"><div class="absolute -right-4 -top-4 w-16 h-16 bg-red-50 rounded-full flex items-center justify-center opacity-50"><i class="fas fa-receipt text-red-500 text-2xl"></i></div><p class="text-gray-500 font-bold mb-1 text-sm md:text-base">รายจ่ายทั่วไป (Expenses)</p><h2 class="text-2xl md:text-4xl font-black text-red-500">${totalExpenses.toLocaleString()} <span class="text-lg text-gray-400">฿</span></h2>${pendingAmount > 0 ? `<p class="text-xs font-bold text-orange-500 mt-1">ค้างชำระ: ${pendingAmount.toLocaleString()} ฿</p>` : ''}</div>
                        <div class="bg-gradient-to-br from-gray-900 to-black p-5 rounded-3xl shadow-lg border border-gray-800 relative overflow-hidden text-white"><div class="absolute -right-4 -top-4 w-20 h-20 bg-white/5 rounded-full flex items-center justify-center"><i class="fas fa-chart-pie text-white/20 text-3xl"></i></div><p class="text-gray-400 font-bold mb-1 text-sm md:text-base">กำไรสุทธิ (Net Profit)</p><h2 class="text-2xl md:text-4xl font-black ${netProfit >= 0 ? 'text-green-400' : 'text-red-400'}">${netProfit.toLocaleString()} <span class="text-lg opacity-50">฿</span></h2></div>
                    `;

                    // วาดกราฟผลประกอบการ
                    drawProfitChart(adminFilter, orders, expenses, totalIncome, totalExpenses, netProfit);

                    const elBestSellers = document.getElementById('dynamic-dashboard-bestsellers');
                    if(elBestSellers) elBestSellers.innerHTML = bestSellersArr.length === 0 ? '<p class="text-gray-400 py-4 text-center">ไม่มีข้อมูลยอดขายในช่วงนี้</p>' : bestSellersArr.map((item, idx) => `<div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100 mb-2"><div class="flex items-center"><span class="w-8 h-8 rounded-full bg-orange-100 text-orange-600 font-bold flex items-center justify-center mr-3">${idx + 1}</span><span class="font-bold text-gray-700">${item.name}</span></div><div class="text-right"><span class="block font-black text-gray-900">${item.count} จาน</span><span class="text-sm text-gray-500">${item.revenue} ฿</span></div></div>`).join('');

                    const elMargin = document.getElementById('dynamic-dashboard-margin');
                    if(elMargin) elMargin.innerHTML = `<h3 class="text-lg font-bold text-green-800 mb-2"><i class="fas fa-calculator mr-2"></i> กำไรขั้นต้น (Gross Margin)</h3><p class="text-green-600 text-sm mb-4">ยอดขายรวม หัก ต้นทุนวัตถุดิบ (ยังไม่หักค่าใช้จ่ายทั่วไป)</p><div class="text-4xl font-black text-green-600">${grossProfit.toLocaleString()} ฿</div>`;

                    const elExpHeader = document.getElementById('dynamic-dashboard-expense-header');
                    if(elExpHeader) elExpHeader.innerHTML = `<div class="flex justify-between items-center border-b pb-3 mb-4"><h3 class="text-xl font-bold text-gray-800"><i class="fas fa-history text-gray-400 mr-2"></i> ประวัติการจ่ายเงิน</h3>${pendingAmount > 0 ? `<span class="bg-orange-100 text-orange-600 text-xs font-bold px-3 py-1 rounded-full">รอจ่าย: ${pendingAmount} ฿</span>` : ''}</div>`;

                    const elExpList = document.getElementById('dynamic-dashboard-expense-list');
                    if(elExpList) elExpList.innerHTML = filteredExp.length === 0 ? '<p class="text-gray-400 py-4 text-center">ไม่มีบันทึก</p>' : filteredExp.sort((a,b) => b.timeMs - a.timeMs).map(e => `<div class="flex justify-between items-center border-b border-gray-100 py-3 last:border-0 hover:bg-gray-50 px-2 rounded-lg transition-colors"><div class="flex flex-col"><div class="flex items-center"><span class="font-bold text-gray-700 mr-2">${e.title}</span>${e.status === 'pending' ? '<span class="bg-orange-100 text-orange-600 text-[10px] font-bold px-2 py-0.5 rounded-full">ค้างชำระ</span>' : '<span class="bg-green-100 text-green-600 text-[10px] font-bold px-2 py-0.5 rounded-full">จ่ายแล้ว</span>'}</div><span class="text-xs text-gray-400">${new Date(e.timeMs).toLocaleString('th-TH')}</span></div><div class="flex items-center space-x-3"><span class="font-bold ${e.status === 'pending' ? 'text-orange-500' : 'text-red-500'}">-${e.amount} ฿</span>${e.status === 'pending' ? `<button onclick="window.ctrl.markExpensePaid('${e.id}')" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-1.5 px-3 rounded-lg shadow-sm transition active:scale-95">ชำระเงิน</button>` : ''}</div></div>`).join('');
                }

                if (adminTab === 'menus') {
                    const elMenus = document.getElementById('dynamic-admin-menus');
                    if(elMenus) elMenus.innerHTML = menus.length === 0 ? `<div class="col-span-full text-center py-12 text-gray-400"><i class="fas fa-utensils text-4xl mb-3 opacity-50"></i><p>ยังไม่มีรายการเมนู</p></div>` : menus.map(m => `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col hover:shadow-md transition"><div class="h-32 bg-gray-200 relative"><img src="${m.image}" onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'" class="w-full h-full object-cover" /><span class="absolute top-2 right-2 bg-black/60 text-white text-xs px-2 py-1 rounded-lg backdrop-blur-sm">${m.category}</span></div><div class="p-4 flex-1 flex flex-col"><h4 class="font-bold text-gray-900 line-clamp-1 mb-2">${m.name}</h4><div class="flex justify-between text-sm mb-1"><span class="text-gray-500">ราคาขาย:</span><span class="font-bold text-green-600">${m.price} ฿</span></div><div class="flex justify-between text-sm mb-4"><span class="text-gray-500">ต้นทุน:</span><span class="font-bold text-orange-500">${m.cost} ฿</span></div><div class="mt-auto flex space-x-2 pt-3 border-t border-gray-100"><button onclick="window.ctrl.openMenuModal('${m.id}')" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-bold transition flex items-center justify-center"><i class="fas fa-edit mr-1"></i> แก้ไข</button><button onclick="window.ctrl.deleteMenu('${m.id}')" class="flex-1 bg-red-50 hover:bg-red-100 text-red-500 py-2 rounded-xl text-sm font-bold transition flex items-center justify-center"><i class="fas fa-trash mr-1"></i> ลบ</button></div></div></div>`).join('');
                }
            }
        }

        // Start the app
        init();

    </script>
</body>
</html>
