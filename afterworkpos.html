<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTERWORK - Restaurant POS</title>
    
    <!-- Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { font-family: 'Kanit', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); }
        .dark-glass { background: rgba(26, 26, 26, 0.85); backdrop-filter: blur(16px); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* เพิ่ม Animation สำหรับ Popup Modal */
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 overflow-hidden">

    <div id="app" class="h-screen w-full flex flex-col relative">
        <!-- Content will be injected here by JavaScript -->
        <div class="flex h-full items-center justify-center">
            <div class="text-2xl font-bold text-orange-500 animate-pulse"><i class="fas fa-spinner fa-spin mr-3"></i>กำลังโหลดระบบ AFTERWORK...</div>
        </div>
    </div>

    <!-- Firebase SDK (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // 🚨 นำ FIREBASE CONFIG ของคุณมาใส่ตรงนี้ 🚨
        // ==========================================
        const myFirebaseConfig = {
            apiKey: "AIzaSyCcF_GpHAEwvn0TMXns2w5eym2EqfJ_No8",
            authDomain: "afterwork-pos.firebaseapp.com",
            projectId: "afterwork-pos",
            storageBucket: "afterwork-pos.firebasestorage.app",
            messagingSenderId: "423772441953",
            appId: "1:423772441953:web:e46e065da264b9323bc920",
            measurementId: "G-H89M5VH6RG"
        };

        // --- ระบบเช็ค Config อัตโนมัติ (สำหรับ Canvas Environment) ---
        let finalConfig = myFirebaseConfig;
        if (Object.keys(finalConfig).length === 0 && typeof __firebase_config !== 'undefined') {
            finalConfig = JSON.parse(__firebase_config);
        }
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'afterwork-pos';
        const app = initializeApp(finalConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ==========================================
        // DATA & STATE MANAGEMENT
        // ==========================================
        const MENU_ITEMS = [
            { id: 'm1', name: 'กุ้งแช่น้ำปลา (ชุดเล็ก)', price: 59, category: 'เมนูกุ้งแช่น้ำปลา', image: 'https://shorturl.asia/yPsIl' },
            { id: 'm2', name: 'กุ้งแช่น้ำปลา (ชุดใหญ่)', price: 100, category: 'เมนูกุ้งแช่น้ำปลา', image: 'https://shorturl.asia/OJt8q' },
            { id: 'm3', name: 'หมูมะนาว (ชุดเล็ก)', price: 59, category: 'เมนูหมูมะนาว', image: 'https://shorturl.asia/Oo0gS' },
            { id: 'm4', name: 'หมูมะนาว (ชุดใหญ่)', price: 100, category: 'เมนูหมูมะนาว', image: 'https://shorturl.asia/3l0fe' },
            { id: 'm5', name: 'ชุดรวมหมู+กุ้ง (ชุดใหญ่)', price: 100, category: 'เมนูชุดรวม', image: 'https://shorturl.asia/5pHgX' },    
            { id: 's1', name: 'สุกี้แห้งหมู', price: 40, category: 'เมนูสุกี้คั่วกระทะ', image: 'https://shorturl.asia/r5nTs' },
            { id: 's2', name: 'สุกี้แห้งกุ้ง', price: 50, category: 'เมนูสุกี้คั่วกระทะ', image: 'https://shorturl.asia/45wT1' },
            { id: 's3', name: 'สุกี้แห้งรวม', price: 60, category: 'เมนูสุกี้คั่วกระทะ', image: 'https://shorturl.asia/NiI12' },
        ];

        window.appState = {
            user: null,
            view: 'home', 
            orders: [],
            expenses: [],
            cart: [],
            customerName: '',
            isOrdering: false,
            adminFilter: 'today',
            kitchenTimerInterval: null,
            isCartOpen: false // สถานะเปิด/ปิด Modal ตะกร้าสำหรับมือถือ
        };

        // ==========================================
        // INITIALIZATION & AUTH
        // ==========================================
        async function init() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth init failed", e);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.appState.user = user;
                    // เริ่มฟังการเปลี่ยนแปลงของข้อมูล
                    startListeners();
                    render();
                }
            });
        }

        // ==========================================
        // DATABASE LISTENERS (เปลี่ยนไปใช้ Shared Public Path)
        // ==========================================
        function startListeners() {
            // Listen to Orders (ข้อมูลกลางของร้าน)
            const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
            onSnapshot(ordersRef, (snapshot) => {
                window.appState.orders = snapshot.docs.map(doc => {
                    const data = doc.data();
                    data.timeMs = data.createdAt?.seconds ? data.createdAt.seconds * 1000 : Date.now();
                    return { id: doc.id, ...data };
                });
                if(window.appState.view === 'kitchen' || window.appState.view === 'admin') render();
            }, (error) => console.error(error));

            // Listen to Expenses (ข้อมูลกลางของร้าน)
            const expensesRef = collection(db, 'artifacts', appId, 'public', 'data', 'expenses');
            onSnapshot(expensesRef, (snapshot) => {
                window.appState.expenses = snapshot.docs.map(doc => {
                    const data = doc.data();
                    data.timeMs = data.createdAt?.seconds ? data.createdAt.seconds * 1000 : Date.now();
                    return { id: doc.id, ...data };
                });
                if(window.appState.view === 'admin') render();
            }, (error) => console.error(error));
        }

        // ==========================================
        // CONTROLLERS
        // ==========================================
        window.ctrl = {
            setView: (view) => {
                window.appState.view = view;
                if(view === 'customer') { 
                    window.appState.cart = []; 
                    window.appState.customerName = ''; 
                    window.appState.isCartOpen = false;
                }
                render();
            },
            
            // เปิด/ปิด Modal ตะกร้า
            toggleCart: () => {
                window.appState.isCartOpen = !window.appState.isCartOpen;
                render();
            },
            
            updateCart: (itemId, delta) => {
                const item = MENU_ITEMS.find(i => i.id === itemId);
                let cart = window.appState.cart;
                const existingIndex = cart.findIndex(i => i.id === itemId);
                
                if (existingIndex >= 0) {
                    cart[existingIndex].quantity += delta;
                    if (cart[existingIndex].quantity <= 0) cart.splice(existingIndex, 1);
                } else if (delta > 0) {
                    cart.push({ ...item, quantity: 1 });
                }
                
                // หากลบของจนตะกร้าว่าง ให้ปิดหน้าต่าง Popup อัตโนมัติ (เฉพาะมือถือ)
                if (cart.length === 0 && window.appState.isCartOpen) {
                    window.appState.isCartOpen = false;
                }
                
                render();
            },

            // ลบเมนูออกจากตะกร้าทั้งหมด
            removeItem: (itemId) => {
                window.appState.cart = window.appState.cart.filter(item => item.id !== itemId);
                if (window.appState.cart.length === 0 && window.appState.isCartOpen) {
                    window.appState.isCartOpen = false;
                }
                render();
            },
            
            setCustomerName: (name) => { window.appState.customerName = name; },
            
            submitOrder: async () => {
                const { cart, customerName, user } = window.appState;
                if (cart.length === 0 || !user || window.appState.isOrdering) return;
                
                window.appState.isOrdering = true;
                window.appState.isCartOpen = false; // ปิด Modal ตอนกดสั่ง
                render();

                const totalAmount = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
                
                try {
                    // บันทึกออเดอร์ลง Shared Public Path
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'orders'), {
                        customerName: customerName || 'ลูกค้าทั่วไป',
                        items: cart,
                        total: totalAmount,
                        status: 'active',
                        createdAt: serverTimestamp(),
                        createdBy: user.uid // เก็บไว้เป็นข้อมูลอ้างอิงว่าส่งจากเครื่องไหน (ถ้าต้องการ)
                    });
                    
                    document.getElementById('app').innerHTML = `
                        <div class="flex flex-col h-screen items-center justify-center bg-orange-50 p-6 text-center fade-in">
                            <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center shadow-2xl mb-8">
                                <i class="fas fa-check-circle text-orange-500 text-6xl"></i>
                            </div>
                            <h1 class="text-5xl font-black text-gray-900 mb-4 tracking-tight">สั่งอาหารสำเร็จ!</h1>
                            <p class="text-2xl text-gray-600 font-medium">ระบบส่งออเดอร์เข้าห้องครัวแล้ว</p>
                        </div>
                    `;
                    
                    setTimeout(() => {
                        window.appState.isOrdering = false;
                        window.ctrl.setView('home');
                    }, 3000);

                } catch (error) {
                    console.error("Submit Error:", error);
                    alert("เกิดข้อผิดพลาด กรุณาลองใหม่");
                    window.appState.isOrdering = false;
                    render();
                }
            },

            completeOrder: async (orderId) => {
                if (!window.appState.user) return;
                try {
                    // อัปเดตสถานะออเดอร์ใน Shared Public Path
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId), {
                        status: 'completed',
                        completedAt: serverTimestamp()
                    });
                } catch (error) {
                    console.error("Complete Error:", error);
                }
            },

            setAdminFilter: (filter) => {
                window.appState.adminFilter = filter;
                render();
            },

            addExpense: async (event) => {
                event.preventDefault();
                if (!window.appState.user) return;
                
                const title = document.getElementById('expTitle').value;
                const amount = parseFloat(document.getElementById('expAmount').value);
                
                if(!title || !amount) return;

                try {
                    // บันทึกรายจ่ายลง Shared Public Path
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'expenses'), {
                        title: title,
                        amount: amount,
                        createdAt: serverTimestamp(),
                        createdBy: window.appState.user.uid
                    });
                    document.getElementById('expTitle').value = '';
                    document.getElementById('expAmount').value = '';
                } catch (error) {
                    console.error("Expense Error:", error);
                }
            }
        };

        // ==========================================
        // RENDER ENGINE
        // ==========================================
        const renderBrand = (sizeStr) => `<div class="font-black tracking-tighter ${sizeStr}">AFTER<span class="text-orange-500">WORK</span></div>`;

        function render() {
            const appDiv = document.getElementById('app');
            const { view } = window.appState;
            
            clearInterval(window.appState.kitchenTimerInterval);

            // เก็บตำแหน่ง Scroll ก่อนที่จะ Render หน้าใหม่ (เพื่อไม่ให้หน้าต่างเด้งไปบนสุดตอนกดสั่ง)
            let menuScrollPos = 0;
            const scrollContainer = document.getElementById('menu-scroll-container');
            if (scrollContainer && view === 'customer') {
                menuScrollPos = scrollContainer.scrollTop;
            }

            if (view === 'home') appDiv.innerHTML = renderHome();
            else if (view === 'customer') {
                appDiv.innerHTML = renderCustomer();
                // คืนค่าตำแหน่ง Scroll ให้กลับมาจุดเดิมหลังจาก Render เสร็จ
                const newScrollContainer = document.getElementById('menu-scroll-container');
                if (newScrollContainer) {
                    newScrollContainer.scrollTop = menuScrollPos;
                }
            }
            else if (view === 'kitchen') {
                appDiv.innerHTML = renderKitchen();
                window.appState.kitchenTimerInterval = setInterval(() => {
                    const timers = document.querySelectorAll('.kitchen-timer');
                    timers.forEach(el => {
                        const start = parseInt(el.dataset.time);
                        const diffSecs = Math.floor((Date.now() - start) / 1000);
                        if (diffSecs >= 0) {
                            const m = String(Math.floor(diffSecs / 60)).padStart(2, '0');
                            const s = String(diffSecs % 60).padStart(2, '0');
                            el.innerHTML = `<i class="fas fa-clock mr-1"></i> ${m}:${s}`;
                            if(diffSecs > 600) { 
                                el.classList.remove('text-orange-400');
                                el.classList.add('text-red-500', 'animate-pulse');
                            }
                        }
                    });
                }, 1000);
            }
            else if (view === 'admin') appDiv.innerHTML = renderAdmin();
        }

        // --- View: HOME ---
        function renderHome() {
            return `
            <div class="flex flex-col h-screen items-center justify-center bg-[#f8f9fa] p-6 relative overflow-hidden fade-in">
                <button onclick="window.ctrl.setView('admin')" class="absolute top-6 right-6 bg-white/80 backdrop-blur shadow-md px-4 py-2 rounded-full text-gray-700 font-bold hover:bg-gray-100 flex items-center transition z-20">
                    <i class="fas fa-chart-line mr-2 text-orange-500"></i> สรุปบัญชี / Admin
                </button>

                <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-orange-200 rounded-full mix-blend-multiply blur-3xl opacity-50"></div>
                <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-yellow-200 rounded-full mix-blend-multiply blur-3xl opacity-50"></div>

                <div class="glass-panel p-10 rounded-[2.5rem] shadow-2xl max-w-md w-full text-center z-10 border border-white/50">
                    <div class="mb-6 flex justify-center">
                        <div class="w-24 h-24 bg-gray-900 rounded-full flex items-center justify-center shadow-lg">
                            <i class="fas fa-fire text-orange-500 text-4xl"></i>
                        </div>
                    </div>
                    ${renderBrand("text-5xl mb-2 text-gray-900")}
                    <p class="text-gray-500 mb-10 font-medium tracking-wide">Restaurant Management System</p>
                    
                    <div class="space-y-5">
                        <button onclick="window.ctrl.setView('customer')" class="w-full bg-gradient-to-r from-orange-500 to-orange-600 text-white text-xl font-bold py-5 rounded-2xl shadow-lg hover:shadow-orange-500/30 transition-transform active:scale-95 flex items-center justify-center">
                            <i class="fas fa-utensils mr-3"></i> ลูกค้าสั่งอาหาร (Menu)
                        </button>
                        <button onclick="window.ctrl.setView('kitchen')" class="w-full bg-gray-900 text-white text-xl font-bold py-5 rounded-2xl shadow-lg hover:bg-black transition-transform active:scale-95 flex items-center justify-center">
                            <i class="fas fa-hat-chef mr-3"></i> หน้าห้องครัว (Kitchen)
                        </button>
                    </div>
                </div>
            </div>`;
        }

        // --- View: CUSTOMER MENU ---
        function renderCustomer() {
            const { cart, customerName, isOrdering, isCartOpen } = window.appState;
            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);

            const categories = [...new Set(MENU_ITEMS.map(i => i.category))];
            let menuHTML = '';

            categories.forEach(cat => {
                menuHTML += `<div class="mb-10">
                    <div class="flex items-center mb-6"><h2 class="text-2xl font-bold text-gray-900">${cat}</h2><div class="flex-1 h-px bg-gray-200 ml-4"></div></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">`;
                
                MENU_ITEMS.filter(i => i.category === cat).forEach(item => {
                    const cartItem = cart.find(c => c.id === item.id);
                    const qty = cartItem ? cartItem.quantity : 0;
                    
                    // ปรับแต่งให้คลิกทั้งกล่องเพื่อเพิ่มเมนูได้
                    menuHTML += `
                    <div onclick="window.ctrl.updateCart('${item.id}', 1)" class="cursor-pointer bg-white rounded-[2rem] overflow-hidden shadow-sm border-2 ${qty > 0 ? 'border-orange-500 ring-4 ring-orange-500/10' : 'border-transparent hover:border-gray-200'} flex flex-col transition-all duration-300 hover:-translate-y-1">
                        <div class="relative h-48 bg-gray-100 pointer-events-none">
                            <img src="${item.image}" class="w-full h-full object-cover" />
                            ${qty > 0 ? `<div class="absolute top-3 right-3 bg-orange-500 text-white w-10 h-10 flex items-center justify-center rounded-full font-bold shadow-lg text-lg">${qty}</div>` : ''}
                        </div>
                        <div class="p-5 flex-1 flex flex-col">
                            <h3 class="text-xl font-bold text-gray-900 mb-2 pointer-events-none">${item.name}</h3>
                            <p class="text-sm text-gray-500 mb-4 line-clamp-2 pointer-events-none">${item.price} บาท</p>
                            <div class="mt-auto flex items-center justify-between pt-2">
                                <span class="text-2xl font-black text-orange-600 pointer-events-none">${item.price} ฿</span>
                                ${qty > 0 ? `
                                <!-- ใส่ onclick stopPropagation เพื่อไม่ให้คลิกปุ่มบวกลบ แล้วไปทริกเกอร์เพิ่มสินค้าซ้ำซ้อน -->
                                <div class="flex items-center space-x-1 bg-gray-50 rounded-full p-1 border border-gray-100" onclick="event.stopPropagation()">
                                    <button onclick="window.ctrl.updateCart('${item.id}', -1)" class="w-10 h-10 rounded-full bg-white shadow-sm text-gray-600 flex items-center justify-center text-xl hover:bg-gray-100"><i class="fas fa-minus text-sm"></i></button>
                                    <span class="text-xl font-bold w-8 text-center text-gray-800">${qty}</span>
                                    <button onclick="window.ctrl.updateCart('${item.id}', 1)" class="w-10 h-10 rounded-full bg-orange-500 shadow-sm text-white flex items-center justify-center text-xl hover:bg-orange-600"><i class="fas fa-plus text-sm"></i></button>
                                </div>
                                ` : `
                                <button class="px-6 py-2.5 rounded-full bg-orange-50 text-orange-600 font-bold hover:bg-orange-100 transition-all pointer-events-none">เพิ่ม</button>
                                `}
                            </div>
                        </div>
                    </div>`;
                });
                menuHTML += `</div></div>`;
            });

            // สร้าง HTML ของรายการในตะกร้า พร้อมปุ่มลบเมนูออก
            let cartItemsHTML = cart.length === 0 
                ? `<div class="text-center text-gray-400 py-12 flex flex-col items-center"><i class="fas fa-shopping-basket text-5xl mb-4 text-gray-200"></i><p>ยังไม่ได้เลือกเมนูความอร่อย</p></div>`
                : cart.map(item => `
                    <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl border border-gray-100">
                        <div class="flex items-start flex-1 pr-2">
                            <span class="font-bold text-orange-500 mr-3 text-lg bg-orange-100 w-8 h-8 flex items-center justify-center rounded-lg shrink-0">${item.quantity}</span>
                            <div class="flex flex-col">
                                <span class="font-bold text-gray-800 text-lg leading-tight mb-1">${item.name}</span>
                                <span class="text-sm text-gray-500">${item.price} ฿ / ที่</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3 shrink-0">
                            <span class="font-black text-gray-900 text-lg">${item.price * item.quantity} ฿</span>
                            <!-- ปุ่มลบรายการ -->
                            <button onclick="window.ctrl.removeItem('${item.id}')" class="w-9 h-9 flex items-center justify-center bg-red-50 text-red-500 hover:bg-red-100 rounded-full transition-colors active:scale-95" title="ลบเมนูนี้">
                                <i class="fas fa-trash-alt text-sm"></i>
                            </button>
                        </div>
                    </div>`).join('');

            // ส่วนสรุปตะกร้าและปุ่มยืนยัน
            const cartContentWrapperHTML = `
                <div class="flex-1 overflow-y-auto mb-6 pr-2 space-y-4 hide-scrollbar">
                    ${cartItemsHTML}
                </div>
                <div class="bg-gray-50 p-5 rounded-3xl border border-gray-100 mb-6 shrink-0">
                    <div class="flex justify-between items-center text-3xl font-black text-gray-900">
                        <span>ยอดรวม</span>
                        <span class="text-orange-600">${totalAmount} <span class="text-xl text-gray-500 font-bold">฿</span></span>
                    </div>
                </div>
                <button onclick="window.ctrl.submitOrder()" ${cart.length === 0 || isOrdering ? 'disabled' : ''} class="w-full shrink-0 py-5 rounded-[1.5rem] text-2xl font-bold text-white transition-all shadow-xl flex justify-center items-center ${cart.length === 0 ? 'bg-gray-300' : 'bg-gradient-to-r from-orange-500 to-orange-600 active:scale-95'}">
                    ${isOrdering ? '<i class="fas fa-spinner fa-spin mr-3"></i> กำลังส่ง...' : 'ยืนยันออเดอร์'}
                </button>
            `;

            return `
            <div class="flex flex-col h-screen bg-[#f4f6f8] fade-in relative">
                
                <!-- Floating Cart Button (แสดงเฉพาะบนจอเล็ก) -->
                <button onclick="window.ctrl.toggleCart()" class="md:hidden fixed bottom-6 right-6 bg-gray-900 text-white w-16 h-16 rounded-full shadow-[0_10px_25px_rgba(0,0,0,0.3)] flex items-center justify-center z-40 hover:scale-105 active:scale-95 transition-all">
                    <i class="fas fa-shopping-cart text-2xl"></i>
                    ${totalItems > 0 ? `<span class="absolute -top-2 -right-2 bg-orange-500 text-white text-sm font-bold w-8 h-8 flex items-center justify-center rounded-full border-4 border-gray-900 shadow-sm">${totalItems}</span>` : ''}
                </button>

                <!-- Mobile Cart Popup Modal -->
                <div class="${isCartOpen ? 'flex' : 'hidden'} md:hidden fixed inset-0 z-50 bg-gray-900/50 backdrop-blur-sm flex-col justify-end transition-opacity duration-300">
                    <!-- พื้นที่ว่างกดเพื่อปิด Modal -->
                    <div class="flex-1" onclick="window.ctrl.toggleCart()"></div>
                    
                    <!-- ส่วนล่าง Modal -->
                    <div class="bg-white rounded-t-[2.5rem] w-full max-h-[85vh] flex flex-col p-6 pb-8 shadow-2xl animate-slide-up">
                        <div class="flex justify-between items-center mb-6 shrink-0">
                            <h2 class="text-2xl font-bold text-gray-900 flex items-center">
                                <i class="fas fa-shopping-cart text-orange-500 mr-3"></i> ตะกร้าของฉัน
                                ${totalItems > 0 ? `<span class="ml-3 bg-orange-100 text-orange-600 text-sm py-1 px-3 rounded-full">${totalItems}</span>` : ''}
                            </h2>
                            <button onclick="window.ctrl.toggleCart()" class="w-10 h-10 bg-gray-100 hover:bg-gray-200 rounded-full text-gray-600 transition-colors flex items-center justify-center"><i class="fas fa-times text-xl"></i></button>
                        </div>
                        ${cartContentWrapperHTML}
                    </div>
                </div>

                <!-- Header -->
                <header class="glass-panel shadow-sm p-4 flex items-center justify-between z-20 sticky top-0 border-b border-gray-100">
                    <button onclick="window.ctrl.setView('home')" class="w-12 h-12 flex items-center justify-center text-gray-600 bg-gray-100 rounded-full transition-colors"><i class="fas fa-arrow-left"></i></button>
                    ${renderBrand("text-3xl text-gray-900")}
                    <div class="w-12"></div>
                </header>

                <div class="flex flex-col md:flex-row flex-1 overflow-hidden">
                    <!-- Left: Menu Container (เพิ่ม ID สำหรับคุมตำแหน่ง Scroll ไม่ให้เด้งขึ้นบนสุด) -->
                    <div id="menu-scroll-container" class="flex-1 overflow-y-auto p-4 md:p-8 pb-32 md:pb-8 hide-scrollbar">
                        <!-- Customer Name Box -->
                        <div class="bg-white p-2 rounded-2xl shadow-sm mb-8 flex items-center border border-gray-100">
                            <div class="w-14 h-14 bg-orange-50 rounded-xl flex items-center justify-center ml-2">
                                <i class="fas fa-user text-orange-500 text-xl"></i>
                            </div>
                            <input type="text" placeholder="ชื่อลูกค้า / เบอร์โต๊ะ" value="${customerName}" oninput="window.ctrl.setCustomerName(this.value)" class="w-full text-2xl p-4 outline-none placeholder-gray-400 bg-transparent font-medium text-gray-800"/>
                        </div>
                        ${menuHTML}
                    </div>

                    <!-- Right: Cart Sidebar (แสดงเฉพาะบนจอใหญ่ Desktop/Tablet แนวนอน) -->
                    <div class="hidden md:flex w-[400px] bg-white border-l border-gray-100 shadow-[-10px_0_30px_rgba(0,0,0,0.02)] z-30 flex-col relative h-full">
                        <div class="p-8 flex-1 flex flex-col h-full">
                            <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center justify-between shrink-0">
                                <span><i class="fas fa-shopping-cart mr-3 text-orange-500"></i> ตะกร้าของฉัน</span>
                                ${totalItems > 0 ? `<span class="bg-orange-500 text-white text-sm py-1 px-3 rounded-full">${totalItems}</span>` : ''}
                            </h2>
                            ${cartContentWrapperHTML}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // --- View: KITCHEN ---
        function renderKitchen() {
            const activeOrders = window.appState.orders
                .filter(o => o.status === 'active')
                .sort((a, b) => a.timeMs - b.timeMs);

            let gridHTML = activeOrders.length === 0 
                ? `<div class="h-full flex flex-col items-center justify-center text-gray-600 col-span-full">
                    <i class="fas fa-check-circle text-6xl text-gray-700 mb-6"></i><h2 class="text-4xl font-bold text-gray-400 mb-2">ครัวว่างแล้ว</h2><p class="text-xl">เยี่ยมมากเชฟ! ไม่มีออเดอร์ค้าง</p>
                   </div>`
                : activeOrders.map((order, index) => `
                    <div class="bg-[#1a1a1a] rounded-3xl shadow-xl overflow-hidden border border-[#2a2a2a] flex flex-col">
                        <div class="bg-[#222] p-5 border-b border-[#333] flex justify-between items-start relative">
                            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-500 to-yellow-500"></div>
                            <div>
                                <span class="bg-orange-500 text-white text-sm font-bold px-3 py-1 rounded-lg mb-3 inline-block shadow-lg">คิวที่ ${index + 1}</span>
                                <h3 class="text-2xl font-bold text-white"><i class="fas fa-user mr-2 text-gray-400 text-lg"></i>${order.customerName}</h3>
                            </div>
                            <div class="bg-[#121212] px-3 py-2 rounded-xl border border-[#333] kitchen-timer text-orange-400 font-mono font-bold" data-time="${order.timeMs}">
                                --:--
                            </div>
                        </div>
                        <div class="p-5 flex-1 space-y-4">
                            ${order.items.map(item => `
                                <div class="flex items-center text-xl bg-[#222] p-3 rounded-2xl border border-[#2a2a2a]">
                                    <span class="bg-orange-500/20 text-orange-400 font-bold w-12 h-12 flex items-center justify-center rounded-xl mr-4 border border-orange-500/30 text-2xl">${item.quantity}</span>
                                    <span class="text-gray-200 font-medium">${item.name}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="p-5 bg-[#1a1a1a] border-t border-[#2a2a2a]">
                            <button onclick="window.ctrl.completeOrder('${order.id}')" class="w-full bg-green-600 text-white text-xl font-bold py-5 rounded-[1.5rem] shadow-lg transition-transform active:scale-95">
                                <i class="fas fa-check-circle mr-2"></i> ทำเสร็จแล้ว (Serve)
                            </button>
                        </div>
                    </div>
                `).join('');

            return `
            <div class="flex flex-col h-screen bg-[#121212] text-gray-100 fade-in">
                <header class="bg-[#1a1a1a] shadow-md p-5 flex items-center justify-between sticky top-0 z-10 border-b border-[#2a2a2a]">
                    <div class="flex items-center">
                        <button onclick="window.ctrl.setView('home')" class="w-12 h-12 flex items-center justify-center text-gray-400 bg-[#2a2a2a] rounded-full mr-4"><i class="fas fa-arrow-left"></i></button>
                        <div>
                            ${renderBrand("text-xl text-white opacity-80 mb-1")}
                            <h1 class="text-2xl font-bold flex items-center text-white leading-none">
                                ระบบหลังครัว <span class="ml-4 bg-orange-500/20 text-orange-400 text-sm font-bold px-3 py-1 rounded-full border border-orange-500/30">รอทำ ${activeOrders.length} คิว</span>
                            </h1>
                        </div>
                    </div>
                </header>
                <div class="flex-1 overflow-y-auto p-6 md:p-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 h-full content-start">
                        ${gridHTML}
                    </div>
                </div>
            </div>`;
        }

        // --- View: ADMIN DASHBOARD ---
        function renderAdmin() {
            const { orders, expenses, adminFilter } = window.appState;
            
            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const startOfWeek = startOfToday - (now.getDay() * 24 * 60 * 60 * 1000);
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
            const startOfYear = new Date(now.getFullYear(), 0, 1).getTime();

            const isWithinFilter = (timeMs) => {
                if (adminFilter === 'today') return timeMs >= startOfToday;
                if (adminFilter === 'week') return timeMs >= startOfWeek;
                if (adminFilter === 'month') return timeMs >= startOfMonth;
                if (adminFilter === 'year') return timeMs >= startOfYear;
                return true;
            };

            let totalIncome = 0;
            let itemSales = {};

            orders.forEach(o => {
                if(isWithinFilter(o.timeMs)) {
                    totalIncome += o.total;
                    o.items.forEach(item => {
                        if(!itemSales[item.name]) itemSales[item.name] = { count: 0, revenue: 0 };
                        itemSales[item.name].count += item.quantity;
                        itemSales[item.name].revenue += (item.price * item.quantity);
                    });
                }
            });

            let totalExpenses = 0;
            const filteredExp = [];
            expenses.forEach(e => {
                if(isWithinFilter(e.timeMs)) {
                    totalExpenses += e.amount;
                    filteredExp.push(e);
                }
            });

            const netProfit = totalIncome - totalExpenses;

            const bestSellersArr = Object.keys(itemSales).map(name => ({
                name, 
                count: itemSales[name].count, 
                revenue: itemSales[name].revenue
            })).sort((a,b) => b.count - a.count).slice(0, 5);

            const bestSellersHTML = bestSellersArr.length === 0 ? '<p class="text-gray-400 py-4 text-center">ไม่มีข้อมูลยอดขายในช่วงนี้</p>' : 
                bestSellersArr.map((item, idx) => `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100 mb-2">
                    <div class="flex items-center">
                        <span class="w-8 h-8 rounded-full bg-orange-100 text-orange-600 font-bold flex items-center justify-center mr-3">${idx + 1}</span>
                        <span class="font-bold text-gray-700">${item.name}</span>
                    </div>
                    <div class="text-right">
                        <span class="block font-black text-gray-900">${item.count} จาน</span>
                        <span class="text-sm text-gray-500">${item.revenue} ฿</span>
                    </div>
                </div>
            `).join('');

            const expListHTML = filteredExp.length === 0 ? '<p class="text-gray-400 py-4 text-center">ไม่มีบันทึกรายจ่าย</p>' :
                filteredExp.sort((a,b) => b.timeMs - a.timeMs).slice(0, 10).map(e => `
                <div class="flex justify-between border-b border-gray-100 py-3 last:border-0">
                    <div class="flex flex-col">
                        <span class="font-bold text-gray-700">${e.title}</span>
                        <span class="text-xs text-gray-400">${new Date(e.timeMs).toLocaleString('th-TH')}</span>
                    </div>
                    <span class="font-bold text-red-500">-${e.amount} ฿</span>
                </div>
            `).join('');

            return `
            <div class="flex flex-col h-screen bg-[#f4f6f8] fade-in overflow-y-auto">
                <header class="bg-white shadow-sm p-4 flex items-center justify-between sticky top-0 z-20">
                    <button onclick="window.ctrl.setView('home')" class="w-12 h-12 flex items-center justify-center text-gray-600 bg-gray-100 rounded-full mr-4"><i class="fas fa-arrow-left"></i></button>
                    <h1 class="text-2xl font-bold flex-1 text-gray-800"><i class="fas fa-chart-line text-orange-500 mr-2"></i> สรุปบัญชีและร้านค้า</h1>
                    
                    <select onchange="window.ctrl.setAdminFilter(this.value)" class="bg-gray-100 border border-gray-200 text-gray-700 rounded-xl px-4 py-2 font-bold outline-none">
                        <option value="today" ${adminFilter === 'today' ? 'selected' : ''}>วันนี้</option>
                        <option value="week" ${adminFilter === 'week' ? 'selected' : ''}>สัปดาห์นี้</option>
                        <option value="month" ${adminFilter === 'month' ? 'selected' : ''}>เดือนนี้</option>
                        <option value="year" ${adminFilter === 'year' ? 'selected' : ''}>ปีนี้</option>
                    </select>
                </header>

                <div class="p-6 max-w-6xl mx-auto w-full">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                            <p class="text-gray-500 font-bold mb-2">ยอดขายสุทธิ (Income)</p>
                            <h2 class="text-4xl font-black text-green-500">${totalIncome.toLocaleString()} ฿</h2>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                            <p class="text-gray-500 font-bold mb-2">รายจ่ายสุทธิ (Expenses)</p>
                            <h2 class="text-4xl font-black text-red-500">${totalExpenses.toLocaleString()} ฿</h2>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-md border-2 ${netProfit >= 0 ? 'border-green-500/20' : 'border-red-500/20'} bg-gradient-to-br from-white to-gray-50">
                            <p class="text-gray-600 font-bold mb-2">กำไรสุทธิ (Net Profit)</p>
                            <h2 class="text-4xl font-black ${netProfit >= 0 ? 'text-green-600' : 'text-red-600'}">${netProfit.toLocaleString()} ฿</h2>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="space-y-8">
                            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                                <h3 class="text-xl font-bold text-gray-800 mb-6 border-b pb-3"><i class="fas fa-crown text-yellow-500 mr-2"></i> 5 อันดับเมนูขายดี</h3>
                                ${bestSellersHTML}
                            </div>
                        </div>

                        <div class="space-y-8">
                            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                                <h3 class="text-xl font-bold text-gray-800 mb-4 border-b pb-3"><i class="fas fa-file-invoice-dollar text-red-500 mr-2"></i> บันทึกรายจ่าย (ต้นทุน, ค่าไฟ ฯลฯ)</h3>
                                <form onsubmit="window.ctrl.addExpense(event)" class="flex flex-col space-y-4">
                                    <div>
                                        <label class="text-sm font-bold text-gray-500 mb-1 block">รายการที่จ่าย</label>
                                        <input type="text" id="expTitle" placeholder="เช่น ค่าหมู, ค่าผัก, ค่าไฟ" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-orange-500" required>
                                    </div>
                                    <div>
                                        <label class="text-sm font-bold text-gray-500 mb-1 block">จำนวนเงิน (บาท)</label>
                                        <input type="number" id="expAmount" placeholder="0" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-orange-500" required>
                                    </div>
                                    <button type="submit" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl transition">บันทึกรายจ่าย</button>
                                </form>
                            </div>

                            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                                <h3 class="text-xl font-bold text-gray-800 mb-4 border-b pb-3">ประวัติรายจ่ายล่าสุด (ในช่วงที่เลือก)</h3>
                                <div class="max-h-[300px] overflow-y-auto pr-2">
                                    ${expListHTML}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // Start the app
        init();

    </script>
</body>
</html>
